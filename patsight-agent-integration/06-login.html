  };
  const label = key => choose(...labels[key]);
  const escaped = text => text.replace(/[&<>"']/g, character => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[character]));

  const translateTree = parent => {
    const walker = document.createTreeWalker(parent, NodeFilter.SHOW_TEXT);
    while (walker.nextNode()) {
      const node = walker.currentNode;
      if (node.parentElement.closest('script,style,pre,code,[data-ps-label],#key-rows,#created-value,#revoke-name')) continue;
      const text = node.textContent.trim();
      if (!textRecords.has(node) && translations.has(text)) textRecords.set(node, { source: text, leading: node.textContent.match(/^\s*/)[0], trailing: node.textContent.match(/\s*$/)[0] });
      const record = textRecords.get(node);
      if (record) node.textContent = record.leading + translate(record.source) + record.trailing;
    }
    parent.querySelectorAll('[title],[aria-label],[placeholder]').forEach(element => {
      let record = attributeRecords.get(element);
      if (!record) { record = {}; attributeRecords.set(element, record); }
      for (const attribute of ['title', 'aria-label', 'placeholder']) {
        const value = element.getAttribute(attribute);
        if (!record[attribute] && translations.has(value)) record[attribute] = value;
        if (record[attribute]) element.setAttribute(attribute, translate(record[attribute]));
      }
    });
  };
  const languageControl = () => '<div class="ps-language" role="group" aria-label="Language / 语言"><button type="button" data-ps-language="zh">中文</button><button type="button" data-ps-language="en">EN</button></div>';
  let mounted = false;
  let dialog;
  let frame = 0;
  let elapsed = 0;
  let playing = false;
  let timer;
  let trigger;
  const caseMarkup = () => '<section class="ps-cases' + (backend ? ' ps-backend' : '') + '" id="agent-cases" aria-labelledby="ps-case-title">' +
    '<div class="ps-case-heading"><div><span class="ps-kicker">AGENT IN ACTION</span><h2 id="ps-case-title" data-ps-label="' + (backend ? 'backendTitle' : 'title') + '">' + label(backend ? 'backendTitle' : 'title') + '</h2>' + slot(backend ? 'backendSubtitle' : 'subtitle', 'p') + '</div></div>' +
    '<div class="ps-case-feature"><div class="ps-case-copy"><span class="ps-case-label" data-ps-label="capability">' + label('capability') + '</span>' + slot('caseTitle', 'h3') + slot('summary', 'p') + '<blockquote class="ps-prompt" data-ps-label="prompt">' + escaped(label('prompt')) + '</blockquote>' +
    '<div class="ps-case-flow">' + slot('install') + '<i aria-hidden="true">→</i>' + slot('key') + '<i aria-hidden="true">→</i>' + slot('task') + '<i aria-hidden="true">→</i>' + slot('result') + '</div><button class="ps-demo-link" type="button" data-ps-open><span aria-hidden="true">▷</span>' + slot('watchFull') + '</button></div>' +
    '<button class="ps-case-poster" type="button" data-ps-open aria-label="' + label('watchFull') + '"><div class="ps-poster-screen"><div class="ps-screen-bar"><span class="ps-screen-dot"></span><span class="ps-screen-dot"></span><span class="ps-screen-dot"></span><b>YOUR AGENT × PATSIGHT</b></div><div class="ps-screen-user" data-ps-label="posterPrompt">' + label('posterPrompt') + '</div><div class="ps-screen-status">✓ ' + slot('ready') + '</div><div class="ps-poster-table">' + slot('compound', 'b') + slot('activity', 'b') + slot('source', 'b') + '<span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div></div><div class="ps-poster-overlay"><span class="ps-play-icon" aria-hidden="true">▶</span><div class="ps-poster-caption">' + slot('playerCaption', 'strong') + slot('videoNote', 'small') + '</div></div></button></div>' +
    (backend ? '' : '<div class="ps-case-related">' + ['reaction','vision','iupac'].map(key => '<article class="ps-case-mini">' + slot(key, 'h3') + slot(key + 'Desc', 'p') + slot(key + 'Note', 'small') + '</article>').join('') + '</div>') + '</section>';
  const dialogMarkup = () => '<dialog class="ps-demo-dialog" id="ps-demo-dialog" aria-labelledby="ps-demo-title"><div class="ps-demo-top"><h2 id="ps-demo-title" data-ps-label="dialogTitle">' + label('dialogTitle') + '</h2><button class="ps-close" type="button" data-ps-close aria-label="' + label('close') + '">×</button></div><div class="ps-demo-stage"><div class="ps-demo-meta"><span>YOUR AGENT × PATSIGHT</span><span class="ps-demo-badge" data-ps-label="videoNote">' + label('videoNote') + '</span></div><div class="ps-demo-window" id="ps-demo-window"></div></div><div class="ps-player-controls"><input class="ps-player-progress" id="ps-player-progress" type="range" min="0" max="32" value="0" step="1" aria-label="' + label('seek') + '"><div class="ps-player-row"><button class="ps-player-toggle" type="button" id="ps-player-toggle"></button><span class="ps-player-time" id="ps-player-time"></span></div><div class="ps-player-chapters">' + ['install','key','task','result'].map((key, index) => '<button type="button" data-ps-chapter="' + index + '">' + (index + 1) + '. ' + slot(key) + '</button>').join('') + '</div></div><div class="ps-demo-footer">' + slot('footer') + '<a href="06-login.html?next=02-agent-connect.html" data-ps-label="start">' + label('start') + '</a></div></dialog>';
  const renderFrame = () => {
    if (!dialog) return;
    const keys = ['install', 'key', 'task', 'result'];
    const current = keys[frame];
    let content = '<div class="ps-screen-bar"><span class="ps-screen-dot"></span><span class="ps-screen-dot"></span><span class="ps-screen-dot"></span><b>' + (frame < 2 ? 'PATSIGHT / SETUP' : 'YOUR AGENT / PATSIGHT SKILL') + '</b></div>' + slot(current + 'Heading', 'h3') + slot(current + 'Desc', 'p');
    if (frame === 1) content += '<code>demo_only_••••••••</code>';
    if (frame === 2) content += '<div class="ps-demo-task">' + slot('prompt') + '</div>';
    if (frame === 3) content += '<div class="ps-demo-result"><table><caption>' + label('sample') + '</caption><thead><tr>' + ['compound','structure','activity','condition','source'].map(key => '<th>' + label(key) + '</th>').join('') + '</tr></thead><tbody><tr><td>Demo-01</td><td>CCO</td><td>—</td><td>—</td><td>' + label('example') + ' 12</td></tr><tr><td>Demo-02</td><td>CC(=O)O</td><td>—</td><td>—</td><td>' + label('example') + ' 18</td></tr></tbody></table></div>';
    content += '<div class="ps-demo-success" data-ps-label="' + current + 'Success">' + label(current + 'Success') + '</div>';
    document.getElementById('ps-demo-window').innerHTML = content;
    document.querySelectorAll('[data-ps-chapter]').forEach(button => {
      if (Number(button.dataset.psChapter) === frame) button.setAttribute('aria-current', 'step');
      else button.removeAttribute('aria-current');
    });
    updatePlayer();
  };
  const updatePlayer = () => {
    if (!dialog) return;
    document.getElementById('ps-player-progress').value = elapsed;
    document.getElementById('ps-player-time').textContent = '00:' + String(elapsed).padStart(2, '0') + ' / 00:32';
    document.getElementById('ps-player-toggle').textContent = label(playing ? 'pause' : elapsed === 32 ? 'replay' : 'play');
  };
  const pause = () => { playing = false; clearInterval(timer); updatePlayer(); };
  const play = () => {
    if (elapsed === 32) { elapsed = 0; frame = 0; renderFrame(); }
    playing = true;
    clearInterval(timer);
    timer = setInterval(() => {
      if (document.hidden) return;
      elapsed = Math.min(32, elapsed + 1);
      const nextFrame = Math.min(3, Math.floor(elapsed / 8));
      if (nextFrame !== frame) { frame = nextFrame; renderFrame(); }
      if (elapsed === 32) pause();
      updatePlayer();
    }, 1000);
    updatePlayer();
  };
  const updateLinks = () => {
    document.querySelectorAll('a[href]').forEach(anchor => {
      const original = anchor.getAttribute('href');
      if (!/^(?:\.\/)?0[123567]-[^/?#]+\.html(?:[?#]|$)/.test(original)) return;
      const address = new URL(original, location.href);
      address.searchParams.set('lang', language);
      anchor.setAttribute('href', address.pathname.split('/').pop() + address.search + address.hash);
    });
  };
  const update = () => {
    document.body.classList.toggle('ps-english', language === 'en');
    if (backend || page === '06-login.html') { translateTree(document.body); document.title = translate(page === '06-login.html' ? '登录演示 · PatSight' : page === '02-agent-connect.html' ? 'Agent 集成配置 · PatSight' : 'API Key 管理 · PatSight'); }
    document.querySelectorAll('[data-ps-label]').forEach(element => { const next = label(element.dataset.psLabel); if (element.textContent !== next) element.textContent = next; });
    document.querySelectorAll('[data-ps-open]').forEach(button => button.setAttribute('aria-label', label('watchFull')));
    document.querySelectorAll('[data-ps-language]').forEach(button => button.setAttribute('aria-pressed', String(button.dataset.psLanguage === language)));
    document.querySelectorAll('nav button[aria-label="切换语言"],nav button[aria-label="Change language"]').forEach(button => button.setAttribute('aria-label', choose('切换语言', 'Change language')));
    if (backend) { const toggle = document.getElementById('rail-toggle'); const expanded = toggle.getAttribute('aria-expanded') === 'true'; toggle.setAttribute('aria-label', choose(expanded ? '收起侧栏' : '展开侧栏', expanded ? 'Collapse sidebar' : 'Expand sidebar')); }
    if (dialog) { dialog.querySelector('[data-ps-close]').setAttribute('aria-label', label('close')); document.getElementById('ps-player-progress').setAttribute('aria-label', label('seek')); renderFrame(); }

    updateLinks();
  };
  const setLanguage = next => {
    language = next === 'en' ? 'en' : 'zh';
    saveLocale();
    document.documentElement.lang = language === 'en' ? 'en' : 'zh-CN';
    const address = new URL(location.href);
    address.searchParams.set('lang', language);
    try { history.replaceState(null, '', address); } catch {}
    update();
  };
  const openDemo = button => {
    trigger = button;
    pause();

    frame = 0;
    renderFrame();
    dialog.showModal();
    if (!matchMedia('(prefers-reduced-motion: reduce)').matches) play();
  };
  const mount = () => {
    if (mounted || !document.body) return;
    const destination = page === '01-home.html' ? document.querySelector('.hero-agent-entry') : page === '05-agent-intro.html' ? document.querySelector('main') : backend ? document.querySelector('.module-content') : document.querySelector('.card');
    if (!destination) return;
    mounted = true;
    if (page === '01-home.html') destination.insertAdjacentHTML('beforeend', '<button class="ps-demo-link ps-home-demo" type="button" data-ps-open><span aria-hidden="true">▷</span>' + slot('watch') + '</button>');

    if (page === '02-agent-connect.html') document.querySelector('.capabilities-simple').insertAdjacentHTML('beforebegin', caseMarkup());

    if (page === '06-login.html') destination.insertAdjacentHTML('afterbegin', '<div style="display:flex;justify-content:flex-end;margin-bottom:16px">' + languageControl() + '</div>');
    if (['01-home.html','02-agent-connect.html','05-agent-intro.html'].includes(page)) {

      dialog.addEventListener('click', event => { if (event.target === dialog) { const bounds = dialog.getBoundingClientRect(); if (event.clientX < bounds.left || event.clientX > bounds.right || event.clientY < bounds.top || event.clientY > bounds.bottom) dialog.close(); } });

    }

    if (page === '02-agent-connect.html') document.getElementById('copy-skill').onclick = () => copyText(choose(installationDraft, 'Install the unified PatSight Skill and existing PatSight CLI using the official instructions. Configure your tenant API key securely in your local environment.\n\nProduct review draft only: verified installation resources and key authentication specifications are not yet available. Do not invent installation commands.\n\nConfirm inputs, capability and possible tenant Credits costs before submitting computations. Query existing task IDs without resubmitting. Preserve sources and assay conditions; never invent results or billing. MolVision Agent access and route coverage remain to be confirmed. Never request or display real keys in chat.'));
    if (backend) { const toggle = document.getElementById('rail-toggle'); toggle.addEventListener('click', () => toggle.setAttribute('aria-label', choose(toggle.getAttribute('aria-expanded') === 'true' ? '收起侧栏' : '展开侧栏', toggle.getAttribute('aria-expanded') === 'true' ? 'Collapse sidebar' : 'Expand sidebar'))); }
    if (page === '06-login.html') document.getElementById('continue').onclick = () => { const requested = parameters.get('next'); const target = ['02-agent-connect.html','03-api-keys.html','04-task-demo.html'].includes(requested) ? requested : '02-agent-connect.html'; location.href = target + '?lang=' + language; };
    update();
    if (location.hash === '#agent-cases') document.getElementById('agent-cases')?.scrollIntoView();
  };
  window.PatSightDemo = { t: choose, translate, language: () => language };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', mount);
  else mount();
  const observer = new MutationObserver(records => {
    if (!mounted) mount();
    if (records.some(record => record.type === 'attributes' && record.attributeName === 'lang')) {
      const next = document.documentElement.lang.startsWith('en') ? 'en' : 'zh';
      if (next !== language) setLanguage(next);
    }
    if (records.some(record => record.type === 'childList' && !record.target.closest?.('.ps-demo-dialog,.ps-cases'))) updateLinks();
  });
  observer.observe(document.documentElement, { attributes: true, attributeFilter: ['lang'] });

})();

</script>
