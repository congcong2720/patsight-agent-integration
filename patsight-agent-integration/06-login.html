<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录演示 · PatSight</title><style>*{box-sizing:border-box}body{margin:0;font:14px/1.8 'Microsoft YaHei',system-ui,sans-serif;background:#f4f7fe;color:#647590;min-height:100vh;display:grid;place-items:center}.card{background:#fff;border:1px solid #e4eaf5;border-radius:18px;padding:36px;width:min(440px,calc(100% - 32px));box-shadow:0 14px 50px #001f5d08}h1{color:#001f5d;font-size:25px;margin:8px 0 16px}.brand{color:#1343d4;font-weight:700;font-size:23px}.action{display:block;text-align:center;background:#1343d4;color:white;border:0;border-radius:8px;padding:13px 20px;width:100%;font:inherit;cursor:pointer;margin-top:25px}a{color:#1343d4;text-decoration:none}.note{font-size:12px;color:#9aa6ba}.back{display:block;text-align:center;margin-top:20px;font-size:12px}</style></head><body><main class="card"><a class="brand" href="01-home.html">PatSight</a><h1>登录后继续</h1><p id="destination">获取安装说明并配置你的 Agent。</p><p class="note">这是登录流程演示，不是真实登录页，不收集账号、密码或密钥。正式上线时接入现有登录系统，并在登录成功后返回目标页面。</p><button id="continue" class="action">模拟登录并继续</button><a class="back" href="05-agent-intro.html">返回 Agent 介绍</a></main><script>const requested=new URLSearchParams(location.search).get('next');const target=['02-agent-connect.html','03-api-keys.html'].includes(requested)?requested:'02-agent-connect.html';document.getElementById('destination').textContent=target==='03-api-keys.html'?'登录后进入 API Key 管理，创建和配置租户凭据。':'登录后进入接入配置，获取并复制安装说明。';document.getElementById('continue').onclick=()=>location.href=target;</script></body></html>
